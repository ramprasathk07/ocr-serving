name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        # No GPU, no model, no Redis server: the test suite uses fakeredis and the
        # in-process mock engine, so CI exercises the real pipeline end to end.
        run: uv sync --frozen --extra worker --extra bench --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest --basetemp=.pytest-tmp -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: gateway
          push: false
          load: true
          tags: ocr-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          target: worker
          push: false
          load: true
          tags: ocr-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
          enable-cache: true
          # lint-and-test already saves this cache under the same key. Pruning here
          # walks the cache while the background services still hold files in it,
          # which fails the post step even when the smoke test passed.
          prune-cache: false

      - run: uv sync --frozen --extra worker --extra bench --extra dev

      - name: Start mock engine, gateway and worker
        env:
          OCR_REDIS_URL: redis://localhost:6379/0
          OCR_POSTGRES_ENABLED: "false"
          OCR_ENGINE_BASE_URL: http://localhost:8001/v1
          OCR_MODEL_ID: mock-ocr-vl
          OCR_API_KEYS: dev-key:ci
          OCR_LOG_FORMAT: text
        run: |
          mkdir -p ci-logs
          nohup uv run uvicorn ocr_serving.serving.mock.server:app --port 8001 > ci-logs/mock.log 2>&1 &
          nohup uv run uvicorn ocr_serving.gateway.main:app --port 8080 > ci-logs/gateway.log 2>&1 &
          nohup uv run python -m ocr_serving.workers.cpu_worker > ci-logs/worker.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8001/v1/models > /dev/null                && curl -sf http://localhost:8080/readyz > /dev/null; then
              echo "stack is up"; exit 0
            fi
            sleep 1
          done
          echo "stack did not come up in 60s"; tail -n 50 ci-logs/*.log; exit 1

      - name: End-to-end smoke
        env:
          OCR_REDIS_URL: redis://localhost:6379/0
        run: uv run python scripts/smoke.py --gateway http://localhost:8080 --api-key dev-key

      - name: Service logs
        if: failure()
        run: tail -n 100 ci-logs/*.log

      - name: Stop services
        if: always()
        run: pkill -f "uvicorn|cpu_worker" || true
