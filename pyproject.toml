[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-serving"
version = "0.1.0"
description = "XFinite-OCR serving breadth: one OCR VLM on vLLM / Triton / Ray Serve / KServe, one benchmark harness"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "redis>=5.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "orjson>=3.10",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
# CPU worker: PDF rendering, preprocessing, layout
worker = [
    "pymupdf>=1.24.3",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pillow>=10.4",
    "onnxruntime>=1.19",
]
# Benchmark harness + corpus builder
bench = [
    "numpy>=1.26",
    "pillow>=10.4",
    "pymupdf>=1.24.3",
]
# Ray Serve + Ray Data. Pin the minor version the day serve_app.py first works.
ray = [
    "ray[serve,data]>=2.44",
]
# GPU engine — install inside WSL2 only. Pin after the Week-1 Day-1 smoke test.
gpu = [
    "vllm>=0.10",
]
# Durable result store (optional at runtime: the service degrades without it).
db = [
    "asyncpg>=0.29",
]
# Tests + lint. fakeredis[lua] backs the queue/event tests without a Redis server.
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "fakeredis>=2.26",
    "lupa>=2.2",
    "ruff>=0.6",
    "websockets>=12",
]

[project.scripts]
ocr-worker = "ocr_serving.workers.cpu_worker:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ocr_serving.gateway" = ["static/*.html"]

[tool.uv]
# vllm/ray bring heavy pins; resolve them only in the WSL venv:
#   uv sync --extra worker --extra bench --extra dev   (Windows or WSL, CPU-only dev)
#   uv sync --all-extras                               (WSL2, full)

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "ASYNC", "PERF"]
# B008: FastAPI's Depends()-in-defaults is the framework idiom.
# UP042: str+Enum keeps pydantic v2 serialisation behaviour we rely on.
# ASYNC240: small metadata-sized path reads stay inline; heavy IO already uses to_thread.
ignore = ["B008", "UP042", "RET504", "PERF203", "ASYNC240"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# src/ for the package, . for the benchmark CLI modules — no install needed to run tests.
pythonpath = ["src", "."]
# System temp is not writable in some sandboxes; keep scratch inside the repo.
addopts = "--basetemp=.pytest-tmp -q"
filterwarnings = ["ignore::DeprecationWarning"]
